# Customer-request triage: n8n (orchestrator) + Postgres (tickets + event log).
#
#   node scripts/make-env.mjs   — creates .env with fresh secrets (never overwrites, never prints)
#   node scripts/setup.mjs      — starts the stack, applies the schema, imports + publishes workflows
# Non-secret settings (AI mode, models, threshold, retention) live in config/triage.env.
name: ctriage

services:
  db:
    image: postgres@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c # postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TRIAGE_DB_PASSWORD:?set TRIAGE_DB_PASSWORD in .env}
      POSTGRES_DB: triage
    ports:
      - "127.0.0.1:55433:5432" # localhost only
    volumes:
      - ctriage-db:/var/lib/postgresql/data
      - ./db:/schema:ro # applied by scripts/setup.mjs on every run (idempotent)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triage"]
      interval: 5s
      retries: 10

  n8n:
    # n8n 2.39.8, pinned by digest
    image: docker.n8n.io/n8nio/n8n@sha256:b73045abaddb40cb4024e86eea1b1f69093501a7339f685a4cd486b7743d23ae
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5680:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # .env: TRIAGE_DB_PASSWORD, N8N_ENCRYPTION_KEY, TRIAGE_WEBHOOK_TOKEN, TRIAGE_SLACK_WEBHOOK_URL
    # config/triage.env: TRIAGE_AI_MODE, models, threshold, retention, support address, TZ
    env_file:
      - .env
      - config/triage.env
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      TRIAGE_WEBHOOK_TOKEN: ${TRIAGE_WEBHOOK_TOKEN:?set TRIAGE_WEBHOOK_TOKEN in .env}
      N8N_SECURE_COOKIE: "false" # localhost over http
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false" # workflows read TRIAGE_* via $env
      NODE_FUNCTION_ALLOW_BUILTIN: crypto # Normalize hashes bodies; token check is timing-safe
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      N8N_WEBHOOK_URL: http://localhost:5680/
      N8N_EDITOR_BASE_URL: http://localhost:5680/
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]'
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168" # hours
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "all" # "none" leaves runs stuck as "running" in 2.39
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
    volumes:
      - ctriage-n8n:/home/node/.n8n
      - ./workflows:/workflows:ro

volumes:
  ctriage-db:
  ctriage-n8n:
